<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parameter value types</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f8fa;
      --color-ink:     #1f2937;
      --color-muted:   #5b6b85;
      --color-accent:  #0f766e;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · FixPortal.FixAtdl</p>
    <h1>Parameter value types &mdash; what FIX wire value does this carry?</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="paramtypes-title paramtypes-desc">
      <title id="paramtypes-title">Parameter value types</title>
      <desc id="paramtypes-desc">The parameter type hierarchy splits at IParameterType into a struct-backed AtdlValueType branch, holding the enum, date-time and floating-point bases, and a class-backed AtdlReferenceType branch holding String_t and Data_t.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6b85"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f8fa"/>

      <!-- ===== CONNECTORS (before nodes) ===== -->
      <!-- root stem + bus + drops to the two branch roots -->
      <line x1="480" y1="120" x2="480" y2="156" stroke="#5b6b85" stroke-width="1"/>
      <line x1="300" y1="156" x2="720" y2="156" stroke="#5b6b85" stroke-width="1"/>
      <line x1="300" y1="156" x2="300" y2="200" stroke="#5b6b85" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="720" y1="156" x2="720" y2="200" stroke="#5b6b85" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- value branch stem + bus + drops -->
      <line x1="300" y1="252" x2="300" y2="300" stroke="#5b6b85" stroke-width="1"/>
      <line x1="120" y1="300" x2="480" y2="300" stroke="#5b6b85" stroke-width="1"/>
      <line x1="120" y1="300" x2="120" y2="348" stroke="#5b6b85" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="300" y1="300" x2="300" y2="348" stroke="#5b6b85" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="300" x2="480" y2="348" stroke="#5b6b85" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- reference branch stem + bus + drops -->
      <line x1="720" y1="252" x2="720" y2="300" stroke="#5b6b85" stroke-width="1"/>
      <line x1="648" y1="300" x2="816" y2="300" stroke="#5b6b85" stroke-width="1"/>
      <line x1="648" y1="300" x2="648" y2="348" stroke="#5b6b85" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="816" y1="300" x2="816" y2="348" stroke="#5b6b85" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ===== NODES ===== -->
      <!-- ROOT -->
      <rect x="384" y="72" width="192" height="48" rx="6" fill="#f7f8fa"/>
      <rect x="384" y="72" width="192" height="48" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="480" y="96" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IParameterType</text>
      <text x="480" y="111" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IControlConvertible</text>

      <!-- L1a AtdlValueType (FOCAL) -->
      <rect x="200" y="200" width="200" height="52" rx="6" fill="#f7f8fa"/>
      <rect x="200" y="200" width="200" height="52" rx="6" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <text x="300" y="226" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AtdlValueType&lt;T&gt;</text>
      <text x="300" y="241" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">struct-backed</text>

      <!-- L1b AtdlReferenceType -->
      <rect x="620" y="200" width="200" height="52" rx="6" fill="#f7f8fa"/>
      <rect x="620" y="200" width="200" height="52" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="720" y="226" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AtdlReferenceType&lt;T&gt;</text>
      <text x="720" y="241" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">class-backed</text>

      <!-- L2-1 EnumTypeBase -->
      <rect x="40" y="348" width="160" height="56" rx="6" fill="#f7f8fa"/>
      <rect x="40" y="348" width="160" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="120" y="374" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EnumTypeBase</text>
      <text x="120" y="390" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Country_t, Currency_t</text>

      <!-- L2-2 DateTimeTypeBase -->
      <rect x="220" y="348" width="160" height="56" rx="6" fill="#f7f8fa"/>
      <rect x="220" y="348" width="160" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="300" y="374" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DateTimeTypeBase</text>
      <text x="300" y="390" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UTC* / TZ* dates</text>

      <!-- L2-3 Float_t -->
      <rect x="400" y="348" width="160" height="56" rx="6" fill="#f7f8fa"/>
      <rect x="400" y="348" width="160" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="480" y="374" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Float_t</text>
      <text x="480" y="390" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Price_t, Qty_t, Amt_t</text>

      <!-- L2-4 String_t -->
      <rect x="578" y="348" width="140" height="56" rx="6" fill="#f7f8fa"/>
      <rect x="578" y="348" width="140" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="648" y="374" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">String_t</text>
      <text x="648" y="390" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Exchange_t &hellip;</text>

      <!-- L2-5 Data_t -->
      <rect x="746" y="348" width="140" height="56" rx="6" fill="#f7f8fa"/>
      <rect x="746" y="348" width="140" height="56" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="816" y="374" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Data_t</text>
      <text x="816" y="390" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">binary payload</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(31,41,55,0.10)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="124" y="511" width="12" height="10" rx="2" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <text x="144" y="520" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">GOD NODE (DEGREE 24)</text>

      <rect x="332" y="511" width="12" height="10" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="352" y="520" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">BASE CLASS</text>

    </svg>
  </div>
</body>
</html>
