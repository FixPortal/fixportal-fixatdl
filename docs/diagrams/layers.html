<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The six pipeline layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f8fa;
      --color-ink:     #1f2937;
      --color-muted:   #5b6b85;
      --color-accent:  #0f766e;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · FixPortal.FixAtdl</p>
    <h1>The six pipeline layers</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
      <title id="layers-title">The six pipeline layers</title>
      <desc id="layers-desc">The library's six pipeline layers in dependency order, from XML ingestion at the top through the domain, control and parameter-type models and validation, down to FIX emission at the bottom, with the file count each layer holds.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6b85"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f8fa"/>

      <!-- ===== DIRECTION INDICATOR (left margin, outside the stack) ===== -->
      <text x="72" y="64" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">XML IN</text>
      <line x1="72" y1="80" x2="72" y2="440" stroke="#7c8ca2" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="72" y="472" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">FIX OUT</text>

      <!-- ===== LAYER 1 — XML Ingestion (FOCAL) ===== -->
      <rect x="136" y="72" width="760" height="64" rx="6" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <text x="160" y="109" fill="rgba(15,118,110,0.80)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">L1</text>
      <text x="232" y="100" fill="#1f2937" font-size="14" font-weight="600" font-family="'Geist', sans-serif">XML Ingestion</text>
      <text x="232" y="118" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace">20 files</text>
      <text x="872" y="100" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">StrategiesReader, ElementFactory</text>
      <text x="872" y="118" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">SchemaDefinitions, ValueConverter</text>

      <!-- ===== LAYER 2 — Domain Model ===== -->
      <rect x="136" y="136" width="760" height="64" rx="6" fill="#ffffff" stroke="rgba(31,41,55,0.12)" stroke-width="1"/>
      <text x="160" y="173" fill="#6b7280" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">L2</text>
      <text x="232" y="164" fill="#1f2937" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Domain Model</text>
      <text x="232" y="182" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace">52 files</text>
      <text x="872" y="164" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Strategy_t, Parameter_t, StrategyPanel_t</text>
      <text x="872" y="182" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">typed collections, ISO reference data</text>

      <!-- ===== LAYER 3 — Control Model ===== -->
      <rect x="136" y="200" width="760" height="64" rx="6" fill="#ffffff" stroke="rgba(31,41,55,0.12)" stroke-width="1"/>
      <text x="160" y="237" fill="#6b7280" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">L3</text>
      <text x="232" y="228" fill="#1f2937" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Control Model</text>
      <text x="232" y="246" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace">26 files</text>
      <text x="872" y="228" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Control_t hierarchy, EnumState</text>
      <text x="872" y="246" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">UI-agnostic</text>

      <!-- ===== LAYER 4 — Parameter Type System ===== -->
      <rect x="136" y="264" width="760" height="64" rx="6" fill="#ffffff" stroke="rgba(31,41,55,0.12)" stroke-width="1"/>
      <text x="160" y="301" fill="#6b7280" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">L4</text>
      <text x="232" y="292" fill="#1f2937" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Parameter Type System</text>
      <text x="232" y="310" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace">41 files</text>
      <text x="872" y="292" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AtdlValueType / AtdlReferenceType</text>
      <text x="872" y="310" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">one class per XML xsi:type</text>

      <!-- ===== LAYER 5 — Validation ===== -->
      <rect x="136" y="328" width="760" height="64" rx="6" fill="#ffffff" stroke="rgba(31,41,55,0.12)" stroke-width="1"/>
      <text x="160" y="365" fill="#6b7280" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">L5</text>
      <text x="232" y="356" fill="#1f2937" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Validation</text>
      <text x="232" y="374" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace">5 files</text>
      <text x="872" y="356" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">EditEvaluator, ValidationResult</text>
      <text x="872" y="374" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">the edit-rule engine</text>

      <!-- ===== LAYER 6 — FIX Emission ===== -->
      <rect x="136" y="392" width="760" height="64" rx="6" fill="#ffffff" stroke="rgba(31,41,55,0.12)" stroke-width="1"/>
      <text x="160" y="429" fill="#6b7280" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.10em">L6</text>
      <text x="232" y="420" fill="#1f2937" font-size="14" font-weight="600" font-family="'Geist', sans-serif">FIX Emission</text>
      <text x="232" y="438" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace">12 files</text>
      <text x="872" y="420" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">FixTagValuesCollection, FixMessage</text>
      <text x="872" y="438" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">StrategyParametersGrpEmitter</text>

      <!-- ===== LEGEND ===== -->
      <line x1="136" y1="500" x2="896" y2="500" stroke="rgba(31,41,55,0.10)" stroke-width="0.8"/>
      <text x="136" y="520" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="220" y="511" width="12" height="10" rx="2" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <text x="240" y="520" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">ENTRY LAYER (HOLDS THE PARSER SEAM)</text>

      <text x="560" y="520" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace">DIAGNOSTICS (19), UTILITY (5) AND CONFIGURATION (1) CROSS-CUT ALL SIX</text>
    </svg>
  </div>
</body>
</html>
