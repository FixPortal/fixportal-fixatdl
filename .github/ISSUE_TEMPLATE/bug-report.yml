name: Bug report
description: Report a reproducible defect in FixPortal.FixAtdl, FixPortal.FixAtdl.Contracts, or their documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include credentials, proprietary strategy documents, or client data.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - FixPortal.FixAtdl
        - FixPortal.FixAtdl.Contracts
        - Documentation only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, .NET SDK, and host application details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe strategy XML and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack traces
      description: Redact secrets and proprietary data before attaching anything.
    validations:
      required: false
