name: Feature request
description: Suggest a focused improvement to FixPortal.FixAtdl, FixPortal.FixAtdl.Contracts, or their documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What host-integration or FIXatdl conformance problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the smallest useful change and its expected API impact.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note public-API, JSON contract (for @fix-portal/fixatdl-react), or FIX wire-format considerations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
    validations:
      required: false
