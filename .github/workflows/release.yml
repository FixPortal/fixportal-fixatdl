name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  pack-and-release:
    name: Publish Package (GitHub Packages + NuGet.org)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      # Restoring the private FixPortal.CodeStyle package needs read:packages.
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflow and shell scripts
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      # A ref gate on refs/tags/v*.*.* proves the ref's SHAPE, never that the commit was
      # reviewed. `git push origin v1.2.3` puts the tag on whatever commit you name,
      # including one that never opened a PR, and this workflow would then pack, publish
      # and cut a GitHub release from it. Rulesets target branches; a branch ruleset does
      # not constrain tags, and this repository has no tag-target ruleset. Assert
      # reachability instead: it fails closed and is visible in the diff. This workflow
      # is tag-only, so the step needs no `if:` of its own. Public repo, so the fetch
      # needs no token even though checkout ran with persist-credentials: false.
      - name: Assert the tagged commit is reachable from main
        run: |
          set -euo pipefail
          # Full fetch of main, not --depth: the tag may name an older main commit, and a
          # shallow fetch leaves merge-base no shared history to walk.
          git fetch --no-tags origin main
          # PEEL the ref first. For an ANNOTATED or signed tag, GITHUB_SHA is the tag
          # OBJECT's sha, not a commit, and merge-base then fails with a confusing
          # message rather than the intended one. `^{commit}` peels a tag object and is
          # the identity for a plain commit sha, so this is correct either way.
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" FETCH_HEAD; then
            echo "::error::Tag '${GITHUB_REF_NAME}' names a commit that is not reachable from main. Only reviewed, merged commits may be released."
            exit 1
          fi

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FixPortal.FixAtdl.slnx

      - name: Build (Release)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${REF_NAME#v}
          dotnet build FixPortal.FixAtdl.slnx -c Release --no-restore /p:Version="${VERSION}"

      - name: Test (Release)
        run: dotnet test --solution FixPortal.FixAtdl.slnx -c Release --no-build

      - name: Pack
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${REF_NAME#v}
          dotnet pack src/FixPortal.FixAtdl/FixPortal.FixAtdl.csproj -c Release --no-build -o artifacts /p:Version="${VERSION}"

      - name: Upload nupkg artefact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # github.token suffices here: packages:write lets it publish to this repo's own
      # namespace (the cross-repo 403 trap only applies to *consumers* restoring it).
      - name: Push to GitHub Packages
        run: dotnet nuget push artifacts/*.nupkg --source https://nuget.pkg.github.com/FixPortal/index.json --api-key ${{ github.token }} --skip-duplicate

      # NuGet.org exchanges this job's GitHub OIDC token for a one-hour, single-use
      # API key. The trusted-publishing policy is scoped to this repository and workflow.
      - name: NuGet.org login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: nuget-login
        with:
          user: chris-fixportal

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        run: gh release create "$RELEASE_TAG" artifacts/*.nupkg --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
